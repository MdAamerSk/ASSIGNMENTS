<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INSECTS</title>
    <link rel="stylesheet" href="style3.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav>
      <div class="nav-left">
        <h1 class="logo">INSECT</h1>
        <div class="search-container">
          <i class="ri-search-line"></i>
          <input type="text" placeholder="Search...">
        </div>
      </div>
      <div class="nav-right">
        <a href="#">Home</a>
        <a href="#">Shop</a>
        <a href="#">About</a>
        <a href="#">Gallery</a>
        <a href="#">Contact</a>
      </div>
    </nav>

    <div class="container">
      <div class="split-bg">
        <div class="bg-white"></div>
        <div class="bg-red"></div>
      </div>

      <div class="mid-image">
        <img src="assets/insect.png" alt="Insect">
      </div>

      <div class="content-wrapper">
        <div class="left-panel">
          <div class="vertical-text">Classification</div>
          <div class="classification-list">
            <ul>
              <li><strong>Class:</strong><span>Insecta</span></li>
              <hr>
              <li><strong>Order:</strong><span>Coleoptera</span></li>
              <hr>
              <li><strong>Family:</strong><span>Cerambycidae</span></li>
              <hr>
              <li><strong>Sub-Family:</strong><span>Cerambycinae</span></li>
              <hr>
              <li><strong>Tribe:</strong><span>Callichromatini</span></li>
              <hr>
              <li><strong>Genus:</strong><span>Pachyteria</span></li>
            </ul>
          </div>
        </div>

        <div class="right-panel">
          <div class="insect-info">
            <h1 class="insect-title">Pachyteria <br>equestris</h1>
            
            <div class="stats-section">
              <div class="sketch-container">
                <img src="assets/insectSketch.png" alt="Sketch">
                <p>32 mm</p>
              </div>
              <div class="divider"></div>
              <div class="details-container">
                <div class="detail-box">
                  <i class="ri-map-pin-line"></i>
                  <div>
                    <label>Locality:</label>
                    <p>Malaysia</p>
                  </div>
                </div>
                <div class="detail-box">
                  <i class="ri-genderless-line"></i>
                  <div>
                    <label>Sex:</label>
                    <p>Male</p>
                  </div>
                </div>
                <div class="detail-box">
                  <i class="ri-ruler-line"></i>
                  <div>
                    <label>Size:</label>
                    <p>32 mm / 12 mm</p>
                  </div>
                </div>
              </div>
            </div>

            <div class="order-section">
              <h2 class="price">$5.99</h2>
              <div class="toggles">
                <div class="toggle-item">
                  <i class="ri-toggle-fill"></i>
                  <span>View detailed antennae</span>
                </div>
                <div class="toggle-item">
                  <i class="ri-toggle-line"></i>
                  <span>View underside</span>
                </div>
              </div>
              <button class="add-btn">Add to collection</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
